<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест Парсера Bayou</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Forum&display=swap" rel="stylesheet">

<!-- Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
  body {
    background-color: #0a0a0a;
    color: #e5e7eb;
    font-family: 'Courier Prime', monospace;
    padding: 2rem;
  }
  .header-font {
    font-family: 'Forum', serif;
    letter-spacing: 0.05em;
  }
  .text-tertiary { color: #dac493; }
  .victorian-card {
    background: linear-gradient(180deg, #1f1c18 0%, #141210 100%);
    border: 1px solid #57524a;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #141210; }
  ::-webkit-scrollbar-thumb { background: #57524a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #dac493; }
</style>
</head>
<body>

<div class="max-w-5xl mx-auto space-y-6">
  <div class="text-center">
    <h1 class="header-font text-3xl text-tertiary mb-2">МОНИТОР ПАРСЕРА</h1>
    <p class="text-gray-400">Парсер работает автоматически на сервере. Эта страница просто показывает логи.</p>
  </div>

  <div class="flex flex-col items-center gap-4">
    <div id="sessionStatus" class="header-font text-xl text-yellow-500">Поиск последней сессии...</div>
    <div class="text-sm text-gray-500" id="sessionTimeInfo"></div>
    
    <button onclick="exportData()" class="text-xs text-[#dac493] border border-[#57524a] px-3 py-1 rounded hover:bg-[#dac493] hover:text-black transition">
      Скачать лог текущей сессии
    </button>
  </div>

  <div class="mt-8">
    <div class="victorian-card p-6 w-full max-w-4xl mx-auto">
      <h2 class="header-font text-2xl text-tertiary mb-4 border-b border-[#57524a] pb-2 text-center">ХРОНОЛОГИЯ МАТЧЕЙ И ПАРСЕРА</h2>
      <div id="unifiedLogs" class="space-y-4 h-[600px] overflow-y-auto pr-2">
        <div class="text-gray-500 text-center mt-10">Загрузка данных...</div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentSessionId = null;
  let exportedEvents = []; 
  
  // Throttle timer for reloading logs so we don't spam requests when many events fire at once
  let reloadTimer = null; 

  async function init() {
    await findLatestSession();
    
    // Слушаем создание новых сессий (чтобы автоматически переключаться на них)
    window.supabase
        .channel('public:sessions')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sessions' }, payload => {
            console.log("Новая сессия обнаружена! Переключаемся...", payload);
            findLatestSession();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions' }, payload => {
            if (payload.new.id === currentSessionId) {
                updateSessionStatusUI(payload.new);
            }
        })
        .subscribe();
        
    // Слушаем изменения в матчах и логах парсера
    window.supabase
        .channel('public:matches_and_logs')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'matches' }, payload => {
            if(payload.new.session_id === currentSessionId) scheduleReload();
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'test_parser_log' }, payload => {
            if(payload.new.session_id === currentSessionId) scheduleReload();
        })
        .subscribe();
  }

  function scheduleReload() {
      if(reloadTimer) clearTimeout(reloadTimer);
      reloadTimer = setTimeout(() => {
          fetchAndRenderLogs();
      }, 500); // debounce 500ms
  }

  async function findLatestSession() {
    try {
      // Ищем самую последнюю сессию (неважно, активна или закрыта)
      const { data } = await window.supabase
        .from('sessions')
        .select('*')
        .order('start_time', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (data) {
        currentSessionId = data.id;
        updateSessionStatusUI(data);
        await fetchAndRenderLogs();
      } else {
        document.getElementById('sessionStatus').innerText = "В базе нет ни одной сессии.";
        document.getElementById('sessionStatus').className = "header-font text-xl text-red-500";
        document.getElementById('unifiedLogs').innerHTML = '<div class="text-gray-500 text-center mt-10">Пусто...</div>';
      }
    } catch (e) {
      console.error(e);
    }
  }

  function updateSessionStatusUI(sessionData) {
      const statusEl = document.getElementById('sessionStatus');
      const timeInfoEl = document.getElementById('sessionTimeInfo');
      
      const startTime = new Date(sessionData.start_time).toLocaleString();
      
      if (sessionData.is_active) {
          statusEl.innerText = "СЕССИЯ АКТИВНА И ПАРСИТСЯ СЕРВЕРОМ";
          statusEl.className = "header-font text-xl text-green-500";
          timeInfoEl.innerText = "Начата: " + startTime;
      } else {
          statusEl.innerText = "СЕССИЯ ЗАКРЫТА";
          statusEl.className = "header-font text-xl text-gray-500";
          let endText = sessionData.end_time ? new Date(sessionData.end_time).toLocaleString() : "Неизвестно";
          timeInfoEl.innerText = "Начата: " + startTime + " | Закрыта: " + endText;
      }
  }

  async function fetchAndRenderLogs() {
    if (!currentSessionId) return;

    try {
      // Ручной ввод
      const { data: manualData } = await window.supabase
        .from('matches')
        .select('*')
        .eq('session_id', currentSessionId)
        .order('created_at', { ascending: true });

      // Ответы парсера
      const { data: autoData } = await window.supabase
        .from('test_parser_log')
        .select('*')
        .eq('session_id', currentSessionId)
        .gt('kills_delta', -1) // Чтобы не брать инициализирующий нуль, если он есть
        .gt('deaths_delta', -1)
        .order('created_at', { ascending: true });
        
      // Фильтруем пустые куски от парсера (где 0/0)
      const filteredAutoData = autoData ? autoData.filter(a => a.kills_delta > 0 || a.deaths_delta > 0) : [];

      renderUnifiedLogs(manualData || [], filteredAutoData);
    } catch (e) {
      console.error(e);
    }
  }

  function renderUnifiedLogs(manualData, autoData) {
    const container = document.getElementById('unifiedLogs');
    
    if (manualData.length === 0 && autoData.length === 0) {
      container.innerHTML = '<div class="text-gray-500 text-center mt-10">Пока нет записей в этой сессии...</div>';
      return;
    }

    const allEvents = [];
    manualData.forEach(m => allEvents.push({ type: 'manual', time: new Date(m.created_at), kills: m.kills, deaths: m.deaths }));
    autoData.forEach(a => allEvents.push({ type: 'auto', time: new Date(a.created_at), kills: a.kills_delta, deaths: a.deaths_delta }));

    allEvents.sort((a, b) => a.time - b.time);

    let manualTotalK = 0, manualTotalD = 0;
    let autoTotalK = 0, autoTotalD = 0;
    
    exportedEvents = []; 
    
    allEvents.forEach(ev => {
        if (ev.type === 'manual') {
            manualTotalK += ev.kills;
            manualTotalD += ev.deaths;
            ev.runK = manualTotalK;
            ev.runD = manualTotalD;
        } else {
            autoTotalK += ev.kills;
            autoTotalD += ev.deaths;
            ev.runK = autoTotalK;
            ev.runD = autoTotalD;
        }
        exportedEvents.push(ev);
    });

    allEvents.reverse();

    let html = `
      <div class="flex justify-around mb-6 bg-black/50 p-4 rounded border border-gray-700 shadow-inner sticky top-0 z-10 backdrop-blur-md">
         <div class="text-center">
            <div class="text-tertiary text-sm font-forum uppercase tracking-widest mb-1">Сумма (Ручной ввод)</div>
            <div class="text-3xl text-white font-bold">${manualTotalK} <span class="text-gray-500 text-xl">/</span> ${manualTotalD}</div>
         </div>
         <div class="text-center">
            <div class="text-red-400 text-sm font-forum uppercase tracking-widest mb-1">Сумма (Парсер)</div>
            <div class="text-3xl text-white font-bold">${autoTotalK} <span class="text-gray-500 text-xl">/</span> ${autoTotalD}</div>
         </div>
      </div>
      <div class="relative border-l-2 border-[#57524a] ml-4 pl-6 space-y-6 font-courier pb-10">
    `;

    allEvents.forEach(ev => {
      const timeStr = ev.time.toLocaleTimeString();
      if (ev.type === 'manual') {
         html += `
            <div class="relative">
               <div class="absolute -left-[31px] top-1.5 w-3 h-3 rounded-full bg-tertiary shadow-[0_0_8px_#dac493]"></div>
               <div class="border border-[#57524a] bg-[#1a1817] p-4 rounded">
                  <div class="text-tertiary text-sm font-bold mb-2">РУЧНОЙ ВВОД [${timeStr}]</div>
                  <div class="text-gray-200">Добавлено: <span class="text-white font-bold text-lg">${ev.kills}</span> убийств, <span class="text-white font-bold text-lg">${ev.deaths}</span> смертей</div>
                  <div class="text-gray-500 text-xs mt-2 border-t border-gray-800 pt-2">Сумма на этот момент: ${ev.runK} / ${ev.runD}</div>
               </div>
            </div>
         `;
      } else {
         html += `
            <div class="relative">
               <div class="absolute -left-[31px] top-1.5 w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
               <div class="border border-red-900 bg-[#261111] p-4 rounded">
                  <div class="text-red-400 text-sm font-bold mb-2">ОБНОВЛЕНИЕ ПАРСЕРА [${timeStr}]</div>
                  <div class="text-gray-200">Пришел кусок: <span class="text-white font-bold text-lg">${ev.kills}</span> убийств, <span class="text-white font-bold text-lg">${ev.deaths}</span> смертей</div>
                  <div class="text-gray-400 text-xs mt-2 border-t border-red-900/50 pt-2">Сумма на этот момент: ${ev.runK} / ${ev.runD}</div>
               </div>
            </div>
         `;
      }
    });

    html += '</div>';
    container.innerHTML = html;
  }

  function exportData() {
    if (exportedEvents.length === 0) {
        alert("Нет данных для выгрузки!");
        return;
    }
    
    let text = "=== ОТЧЕТ ТЕСТИРОВАНИЯ ПАРСЕРА ===\n";
    text += "Сессия: " + currentSessionId + "\n";
    text += "Сгенерировано: " + new Date().toLocaleString() + "\n\n";
    
    exportedEvents.forEach(ev => {
        const timeStr = ev.time.toLocaleString();
        if (ev.type === 'manual') {
            text += `[${timeStr}] РУЧНОЙ ВВОД: +${ev.kills} киллов, +${ev.deaths} смертей (Всего: ${ev.runK}/${ev.runD})\n`;
        } else {
            text += `[${timeStr}] ПАРСЕР: +${ev.kills} киллов, +${ev.deaths} смертей (Всего: ${ev.runK}/${ev.runD})\n`;
        }
    });

    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `parser_log_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
