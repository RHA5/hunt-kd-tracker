<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Hunt Tracker — Вход</title>

    <!-- Google Fonts — строго по спецификации TYPOGRAPHY.md -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Forum&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#141313",
                        "tertiary": "#dac493",
                        "on-background": "#e5e2e1",
                        "on-surface-variant": "#c4c7c7",
                        "error": "#ffb4ab"
                    },
                    fontFamily: {
                        "garamond": ["EB Garamond", "serif"],
                        "forum": ["Forum", "serif"],
                        "courier": ["Courier Prime", "monospace"],
                        "stamp": ["Special Elite", "monospace"]
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #000;
            margin: 0;
            padding: 0;
            font-family: 'EB Garamond', serif;
        }

        /* ФОНОВОЕ ИЗОБРАЖЕНИЕ (Игровой контейнер 1920x1080) */
        .bg-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;
            background-image: url('bg_login.webp');
            background-size: cover;
            background-position: center;
            transform-origin: center center;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 180px rgba(0,0,0,0.85);
            z-index: 2;
            pointer-events: none;
        }

        /* КОНТЕЙНЕР ФОРМЫ — СМЕЩЕНИЕ ТОЧНО НА БЕЛО-ЖЕЛТУЮ БУМАГУ КНИГИ */
        .login-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            /* Сдвигаем форму вправо и вниз, так как "бумага" на обложке книги немного смещена от географического центра экрана */
            transform: translate(26px, 12px);
            width: 530px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 30px;
        }

        /* ПОЛЯ ВВОДА — С ЛИНИЯМИ И ПОДПИСЯМИ НА ЛИНИИ */
        .input-group {
            position: relative;
            border-bottom: 2px solid #3d3122; /* Четкая контрастная линия */
            padding-bottom: 2px;
            display: flex;
            align-items: flex-end;
            width: 100%;
        }

        .input-label {
            font-family: 'Forum', serif;
            font-size: 14px;
            color: #231b13; /* Отчетливый темный цвет */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            padding-right: 12px;
            padding-bottom: 4px;
            user-select: none;
        }

        .hunt-input {
            flex-grow: 1;
            background: transparent !important;
            border: none !important;
            color: #120d08 !important; /* Насыщенный темный цвет ввода */
            font-family: 'Special Elite', monospace !important;
            font-size: 20px !important;
            font-weight: 600;
            padding: 0 0 2px 0 !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* Сброс желтого автозаполнения Chrome */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #120d08;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* ГЛАВНАЯ КНОПКА ВОЙТИ */
        .btn-identify {
            margin-top: 12px;
            height: 42px;
            width: 240px;
            align-self: center;
            background: linear-gradient(180deg, #26201b 0%, #171411 100%);
            border: 2px solid #8c734b;
            color: #d9c39c;
            font-family: 'Forum', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 4px 12px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .btn-identify:hover {
            border-color: #e6c885;
            background: linear-gradient(180deg, #332a22 0%, #1f1b17 100%);
            box-shadow: inset 0 0 10px rgba(230, 200, 133, 0.2), 0 0 20px rgba(181, 161, 114, 0.5);
            color: #ffffff;
        }

        .btn-identify:active {
            transform: scale(0.98) translateY(1px);
        }

        /* Кнопка зрителя */
        .btn-viewer {
            margin-top: 10px;
            align-self: center;
            background: transparent;
            border: none;
            color: #8c734b;
            font-family: 'Forum', serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .btn-viewer:hover {
            color: #dac493;
            text-decoration: underline;
        }

        /* МОБИЛЬНЫЙ ДИЗАЙН (До 768px) */
        @media (max-width: 768px) {
            .bg-container {
                position: relative;
                top: 0;
                left: 0;
                width: 100vw;
                min-height: 100vh;
                background-image: none;
                background-color: #141313;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transform: none !important;
            }
            .login-overlay {
                position: relative;
                inset: auto;
            }
            .form-container {
                transform: none;
                width: 90vw;
                background: #171515;
                border: 1px solid #3d3935;
                box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,1);
                border-radius: 4px;
                padding: 40px 20px;
                gap: 25px;
            }
            .form-container::before {
                content: "ВХОД ДЛЯ ОХОТНИКОВ";
                text-align: center;
                font-family: 'Forum', serif;
                font-size: 16px;
                color: #dac493;
                letter-spacing: 3px;
                margin-bottom: 10px;
            }
            .input-label {
                color: #8e9192;
            }
            .hunt-input {
                color: #dac493 !important;
            }
            input:-webkit-autofill,
            input:-webkit-autofill:hover, 
            input:-webkit-autofill:focus {
                -webkit-text-fill-color: #dac493;
            }
        }
    </style>
</head>

<body class="antialiased selection:bg-tertiary selection:text-background">

    <!-- ИГРОВОЙ КОНТЕЙНЕР (Фиксированный размер 1920x1080, масштабируется через JS) -->
    <div id="game-container" class="bg-container">
        
        <!-- Затемнение по краям -->
        <div class="vignette"></div>

        <!-- Поля ввода, приклеенные к центру -->
        <main class="login-overlay">
            <form class="form-container" onsubmit="return handleLogin(event)" novalidate>

                <div class="input-group">
                    <label class="input-label" for="username">ЛОГИН:</label>
                    <input class="hunt-input" id="username" type="text" autocomplete="username">
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">ПАРОЛЬ:</label>
                    <input class="hunt-input" id="password" type="password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-identify">
                    ВОЙТИ
                </button>

                <button type="button" class="btn-viewer" onclick="window.location.href='index.html'">
                    ВХОД ДЛЯ ЗРИТЕЛЕЙ
                </button>

            </form>
        </main>

    </div>

    <script>
        // Адаптивное масштабирование контейнера
        function resizeGameContainer() {
            const container = document.getElementById('game-container');
            if (!container) return;
            if (window.innerWidth <= 768) {
                container.style.transform = 'none';
                return;
            }
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            // Используем Math.max для имитации "cover" — контейнер всегда заполняет экран без пустот
            const scale = Math.max(scaleX, scaleY);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resizeGameContainer);
        resizeGameContainer();

        async function handleLogin(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) {
                alert('Введите логин и пароль');
                return false;
            }

            try {
                // Превращаем логин в email "под капотом", так как Supabase требует формат email
                const emailFormat = usernameInput + '@hunt.local';
                const { data, error } = await window.supabase.auth.signInWithPassword({
                    email: emailFormat,
                    password: passwordInput,
                });

                if (error) {
                    alert('Неверный логин или пароль');
                    return false;
                }

                // Успешный вход
                window.location.href = 'admin.html';
            } catch (err) {
                console.error('Ошибка авторизации:', err);
                alert('Ошибка сервера');
            }
            
            return false;
        }

        async function goToAnalytics(event) {
          if (event) event.preventDefault();
          const { data: { session } } = await window.supabase.auth.getSession();
          if (session) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }
    </script>
</body>
</html>
