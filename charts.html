<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Hunt Tracker — Графики</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Forum&family=Special+Elite&display=swap" rel="stylesheet">

<!-- Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#141313",
          "tertiary": "#dac493",
          "on-background": "#e5e2e1",
          "on-surface-variant": "#c4c7c7",
          "error": "#ffb4ab"
        },
        fontFamily: {
          "garamond": ["EB Garamond", "serif"],
          "forum": ["Forum", "serif"],
          "courier": ["Courier Prime", "monospace"],
          "stamp": ["Special Elite", "monospace"]
        }
      }
    }
  }
</script>

<style>
  * { box-sizing: border-box; }

  html {
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  html, body {
    min-height: 100vh;
    overflow-x: hidden;
    background-image: url('1.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #141313;
    color: #e5e2e1;
    font-family: 'EB Garamond', serif;
  }
  .vignette::after {
    content: '';
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.95);
    pointer-events: none;
    z-index: 10;
  }
  
  /* ШАПКА */
  .nav-link {
    font-family: 'Forum', serif;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 10px;
    color: rgba(229, 226, 225, 0.5);
    transition: all 0.3s ease;
    text-transform: uppercase;
  }
  @media (min-width: 768px) {
    .nav-link {
      font-size: 13px;
      letter-spacing: 2px;
      padding: 10px 20px;
    }
  }
  .nav-link:hover {
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
  }
  .nav-link.active {
    color: #ffffff;
    font-weight: 700;
    border-bottom: 2px solid #b5a172;
    text-shadow: 0 0 10px rgba(218, 196, 147, 0.6);
  }

  /* ВИКТОРИАНСКАЯ КАРТОЧКА */
  .victorian-card {
    border: 1px solid #57524a;
    background-color: rgba(24, 22, 21, 0.92);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
  }

  /* КНОПКИ-ВКЛАДКИ СЛЕВА */
  .tab-btn {
    font-family: 'Forum', serif;
    font-size: 14px;
    text-align: left;
    padding: 10px 16px;
    color: #8e9192;
    border-left: 2px solid transparent;
    transition: all 0.2s ease;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .tab-btn:hover { color: #e5e2e1; background: rgba(255,255,255,0.03); }
  .tab-btn.active {
    color: #dac493;
    border-left: 2px solid #dac493;
    background: rgba(218, 196, 147, 0.05);
    text-shadow: 0 0 10px rgba(218, 196, 147, 0.4);
  }

  /* ФИЛЬТРЫ СПРАВА */
  .filter-btn {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    padding: 6px 14px;
    color: #8e9192;
    border: 1px solid #57524a;
    border-radius: 2px;
    transition: all 0.2s ease;
  }
  .filter-btn:hover { border-color: #8e9192; color: #e5e2e1; }
  .filter-btn.active {
    background: rgba(218, 196, 147, 0.1);
    border-color: #dac493;
    color: #dac493;
  }

  /* ТУЛТИП APEXCHARTS */
  .apexcharts-tooltip {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    transition: all 0.2s ease !important;
  }
  .apexcharts-tooltip-title { display: none !important; }

</style>
</head>

<body class="h-screen overflow-hidden w-full flex flex-col justify-between p-3 md:p-4 vignette antialiased selection:bg-error selection:text-on-error">

  <!-- TOP NAVIGATION -->
  <header class="flex justify-center items-center w-full shrink-0 relative z-40 mb-4 mt-2">
    <nav class="flex gap-2 sm:gap-6 md:gap-10 font-forum">
      <a class="nav-link" href="#" onclick="goToAnalytics(event)">АНАЛИТИКА</a>
      <a class="nav-link" href="history.html">ИСТОРИЯ</a>
      <a class="nav-link active" href="charts.html">ГРАФИКИ</a>
    </nav>
  </header>

  <main class="flex-grow w-full max-w-[1400px] mx-auto flex flex-col md:flex-row gap-5 relative z-20 overflow-hidden pb-4">
    
    <!-- LEFT PANEL (TABS) -->
    <div class="w-full md:w-64 shrink-0 flex flex-col gap-4">
      <div class="victorian-card p-3 rounded-sm flex flex-col gap-1 h-full">
        <h3 class="font-forum text-lg text-[#e5e2e1] uppercase tracking-[2px] border-b border-[#57524a] pb-2 mb-2 px-2 text-center md:text-left">Выберите график</h3>
        <button class="tab-btn active" onclick="switchTab('pulse')">Динамика сессий</button>
        <button class="tab-btn" onclick="switchTab('meta')">Самочувствие</button>
      </div>
    </div>

    <!-- RIGHT PANEL (CONTENT + FILTERS) -->
    <div class="flex-grow flex flex-col gap-4 overflow-hidden h-full">
      
      <!-- FILTERS HEADER -->
      <div class="victorian-card px-6 py-5 rounded-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shrink-0 min-h-[110px]">
        <div class="flex flex-col justify-center w-full md:max-w-[50%]">
          <h2 id="chart-title" class="font-forum text-tertiary tracking-[2px] uppercase text-2xl whitespace-nowrap">Динамика сессий</h2>
          <p id="chart-description" class="font-garamond text-sm text-[#8e9192] mt-2 h-[40px] overflow-hidden leading-tight flex items-center">Отображает результативность на каждом стриме. Зеленый тренд — идешь в плюс, красный — в минус.</p>
        </div>
        <div class="flex flex-nowrap gap-3 items-center shrink-0" id="filters-container">
           <button class="filter-btn active whitespace-nowrap" onclick="applyFilter('10')">10 сессий</button>
           <button class="filter-btn whitespace-nowrap" onclick="applyFilter('month')">За месяц</button>
           <button class="filter-btn whitespace-nowrap" onclick="applyFilter('all')">Всё время</button>
           <div class="flex items-center gap-1 border border-[#57524a] rounded-sm p-1.5 ml-2 whitespace-nowrap" id="custom-date-container">
             <input type="date" id="custom-start" class="bg-transparent text-[#8e9192] font-garamond text-sm outline-none border-none h-7 w-[115px] px-1 cursor-pointer" onclick="applyCustomFilter(); this.showPicker && this.showPicker()" onkeydown="return false;" onchange="applyCustomFilter()">
             <span class="text-[#8e9192] text-sm">-</span>
             <input type="date" id="custom-end" class="bg-transparent text-[#8e9192] font-garamond text-sm outline-none border-none h-7 w-[115px] px-1 cursor-pointer" onclick="applyCustomFilter(); this.showPicker && this.showPicker()" onkeydown="return false;" onchange="applyCustomFilter()">
           </div>
        </div>
      </div>
      
      <!-- CHART CONTAINER -->
      <div class="victorian-card p-4 md:p-6 flex-grow rounded-sm relative overflow-hidden flex flex-col">
        <div id="chart-loader" class="absolute inset-0 flex items-center justify-center bg-[#141313]/80 backdrop-blur-sm z-10">
          <p class="font-forum text-tertiary tracking-widest uppercase animate-pulse">Загрузка данных...</p>
        </div>
        <div class="w-full flex-grow relative min-h-[300px]">
          <div id="apex-chart" class="absolute inset-0 w-full h-full"></div>
        </div>
      </div>
      
    </div>

  </main>

  <script>
    let currentChart = null;
    let currentTab = 'pulse';
    let currentFilter = '10';
    
    // Глобальные данные сессий из Supabase
    let allSessions = [];
    let globalTargetKD = 2.0;

    // Вспомогательная функция роутинга
    async function goToAnalytics(event) {
      if (event) event.preventDefault();
      const { data: { session } } = await window.supabase.auth.getSession();
      if (session) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    // Инициализация при загрузке
    document.addEventListener("DOMContentLoaded", async () => {
      await fetchSupabaseData();
      currentTab = null; 
      switchTab('pulse');
    });

    // 1. Загрузка реальных данных из Supabase
    async function fetchSupabaseData() {
        try {
            // Получаем цель из профиля
            const { data: profileData } = await window.supabase
                .from('hunter_profile')
                .select('target_kd')
                .single();
            if (profileData && profileData.target_kd) {
                globalTargetKD = profileData.target_kd;
            }

            // Получаем историю сессий
            const { data: sessionsData, error } = await window.supabase
                .from('sessions')
                .select('start_time, kills, deaths, matches_count, condition_rating')
                .order('start_time', { ascending: true });

            if (error) throw error;

            // Фильтруем пустые и считаем KD
            allSessions = sessionsData.filter(s => s.kills != null && s.deaths != null).map((s, index) => {
                let kd = s.deaths === 0 ? s.kills : (s.kills / s.deaths);
                let kpg = s.matches_count > 0 ? (s.kills / s.matches_count) : 0;
                let dpg = s.matches_count > 0 ? (s.deaths / s.matches_count) : 0;
                
                // Красивое форматирование даты
                let date = new Date(s.start_time);
                let dateStr = date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                let fullDateStr = date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });

                return {
                    label: dateStr,
                    fullLabel: `Стрим ${fullDateStr}`,
                    date: date,
                    kd: Number(kd.toFixed(2)),
                    kpg: Number(kpg.toFixed(2)),
                    dpg: Number(dpg.toFixed(2)),
                    condition: s.condition_rating || 0
                };
            });

            document.getElementById('chart-loader').style.display = 'none';

        } catch (error) {
            console.error("Ошибка загрузки данных:", error);
            document.getElementById('chart-loader').innerHTML = `<p class="font-forum text-error tracking-widest uppercase">Ошибка БД</p>`;
        }
    }

    // 2. Управление UI (Вкладки и Фильтры)
    function switchTab(tabId) {
        if (currentTab === tabId) return;
        currentTab = tabId;
        
        // Обновляем активный класс внопок
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.getAttribute('onclick').includes(tabId)) btn.classList.add('active');
        });

        // Меняем заголовок и описание
        const titleMap = {
            'pulse': { title: 'Динамика сессий', desc: 'Отображает результативность на каждом стриме. Зеленый тренд — идешь в плюс, красный — в минус.' },
            'meta': { title: 'Самочувствие', desc: 'Зависимость игровых результатов от физического состояния и настроения.' }
        };
        document.getElementById('chart-title').textContent = titleMap[tabId].title;
        document.getElementById('chart-description').textContent = titleMap[tabId].desc;

        renderChart();
    }

    function applyCustomFilter() {
        currentFilter = 'custom';
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        const container = document.getElementById('custom-date-container');
        if(container) {
            container.style.borderColor = '#dac493';
            container.style.backgroundColor = 'rgba(218, 196, 147, 0.1)';
        }
        renderChart();
    }

    function applyFilter(filterType) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        const container = document.getElementById('custom-date-container');
        if(container) {
            container.style.borderColor = '#57524a';
            container.style.backgroundColor = 'transparent';
        }
        renderChart();
    }

    // Применение фильтра времени к массиву данных
    function getFilteredData() {
        if (!allSessions || allSessions.length === 0) return [];
        
        let data = [...allSessions];
        
        if (currentFilter === '10') {
            data = data.slice(-10);
        } else if (currentFilter === 'month') {
            const oneMonthAgo = new Date();
            oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
            data = data.filter(s => s.date >= oneMonthAgo);
        } else if (currentFilter === 'custom') {
            const startVal = document.getElementById('custom-start').value;
            const endVal = document.getElementById('custom-end').value;
            
            if (startVal) {
                const startDate = new Date(startVal);
                startDate.setHours(0,0,0,0);
                data = data.filter(s => s.date >= startDate);
            }
            if (endVal) {
                const endDate = new Date(endVal);
                endDate.setHours(23,59,59,999);
                data = data.filter(s => s.date <= endDate);
            }
        }
        
        return data;
    }

    // 3. Рендер Графиков
    function renderChart() {
        if (currentChart) {
            try { currentChart.destroy(); } catch(e) {}
            currentChart = null;
        }
        
        // Полностью пересоздаем DOM-контейнер графика, чтобы избежать конфликтов ApexCharts при смене вкладок
        const oldContainer = document.querySelector("#apex-chart");
        if (oldContainer) {
            const newContainer = document.createElement("div");
            newContainer.id = "apex-chart";
            newContainer.className = "absolute inset-0 w-full h-full";
            oldContainer.parentNode.replaceChild(newContainer, oldContainer);
        }

        const data = getFilteredData();
        if (data.length === 0) {
            document.querySelector("#apex-chart").innerHTML = '<div class="w-full h-full flex items-center justify-center text-[#8e9192] font-garamond">Нет данных за этот период</div>';
            return;
        }

        if (currentTab === 'pulse') {
            renderPulseChart(data);
        } else if (currentTab === 'meta') {
            renderMetaChart(data);
        }
    }

    // =====================================
    // ГРАФИК 1: ПУЛЬС СТРИМОВ (Наша гордость)
    // =====================================
    function renderPulseChart(data) {
        const labels = data.map(d => d.label);
        const values = data.map(d => d.kd);
        
        const baseKD = globalTargetKD;
        
        let maxKD = Math.max(baseKD, ...values) + 0.2;
        let minKD = Math.min(baseKD, ...values) - 0.2;
        if (minKD < 0) minKD = 0;

        // Вычисление линии тренда по реальным значениям (Линейная регрессия)
        const n = values.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        for (let i = 0; i < n; i++) {
            sumX += i;
            sumY += values[i];
            sumXY += i * values[i];
            sumXX += i * i;
        }
        const slope = (n * sumXY - sumX * sumY) / (Math.max(1, n * sumXX - sumX * sumX));
        const intercept = (sumY - slope * sumX) / Math.max(1, n);
        const trendData = values.map((_, i) => Number((slope * i + intercept).toFixed(2)));

        // Цветовая функция для градиента тренда (Серый возле baseKD, зеленый выше, красный ниже)
        const getColorForKD = (kd) => {
            if (kd >= baseKD) {
                let ceiling = baseKD + 1.5;
                let ratio = ceiling > baseKD ? (kd - baseKD) / (ceiling - baseKD) : 1;
                ratio = Math.min(1, Math.max(0, ratio));
                let s = Math.round(10 + 90 * ratio); // От 10% (почти серый) до 100% (неоновый)
                let l = Math.round(57 - 7 * ratio);  // Чуть темнеет для насыщенности
                return `hsl(120, ${s}%, ${l}%)`;
            } else {
                let floor = baseKD > 1.0 ? 1.0 : baseKD - 0.5;
                let ratio = baseKD > floor ? (baseKD - kd) / (baseKD - floor) : 1;
                ratio = Math.min(1, Math.max(0, ratio));
                let s = Math.round(10 + 90 * ratio);
                let l = Math.round(57 - 7 * ratio);
                return `hsl(0, ${s}%, ${l}%)`;
            }
        };

        // Вычисляем цвет тренда на основе его НАПРАВЛЕНИЯ (растет или падает)
        let trendDiff = trendData[trendData.length - 1] - trendData[0];
        let maxDiff = 1.0; // Разница в 1.0 KD за период считается максимальным прогрессом/регрессом
        let trendRatio = trendDiff / maxDiff; 
        trendRatio = Math.max(-1, Math.min(1, trendRatio));
        
        let trendColor;
        if (trendRatio >= 0) {
            let s = Math.round(10 + 90 * trendRatio);
            let l = Math.round(57 - 7 * trendRatio);
            trendColor = `hsl(120, ${s}%, ${l}%)`;
        } else {
            let absRatio = Math.abs(trendRatio);
            let s = Math.round(10 + 90 * absRatio);
            let l = Math.round(57 - 7 * absRatio);
            trendColor = `hsl(0, ${s}%, ${l}%)`;
        }
        
        const mainLineColor = '#dac493'; // Статичный цвет основного графика

        const options = {
          series: [
            { name: "KD", data: values },
            { name: "Тренд", data: trendData }
          ],
          chart: {
            height: '100%',
            type: 'line', 
            fontFamily: 'EB Garamond, serif',
            background: 'transparent',
            toolbar: { show: false },
            zoom: { enabled: false },
            animations: { enabled: true, easing: 'easeinout', speed: 800 }
          },
          colors: [mainLineColor, trendColor], 
          fill: {
            type: 'solid',
            opacity: [1, 1]
          },
          stroke: { 
            curve: ['smooth', 'straight'], // Основа плавная, тренд идеально прямой
            width: [3, 2], 
            dashArray: [0, 0] 
          }, 
          markers: {
            size: [5, 0], // Точки только на KD, тренд без точек
            colors: ['#141313'], 
            strokeColors: mainLineColor,
            strokeWidth: 2,
            hover: { size: 8 }
          },
          dataLabels: { enabled: false },
          xaxis: {
            categories: labels,
            tickAmount: Math.min(labels.length, 12),
            axisBorder: { show: false },
            axisTicks: { show: false },
            labels: { style: { colors: '#8e9192', fontFamily: 'Forum, serif', fontSize: '11px' } },
            tooltip: { enabled: false },
            crosshairs: { show: false }
          },
          yaxis: {
            max: maxKD,
            min: minKD,
            tooltip: { enabled: false },
            labels: {
              style: { colors: '#8e9192', fontFamily: 'Courier Prime, monospace' },
              formatter: (value) => { return value.toFixed(2) }
            }
          },
          grid: { borderColor: 'rgba(255, 255, 255, 0.05)', strokeDashArray: 4 },
          theme: { mode: 'dark' },
          annotations: {
            yaxis: [{
              y: baseKD,
              borderColor: 'rgba(218, 196, 147, 0.4)',
              strokeDashArray: 5
            }]
          },
          tooltip: {
            enabled: true,
            cssClass: 'tt-wrapper',
            shared: true, 
            intersect: false, 
            custom: function({series, seriesIndex, dataPointIndex, w}) {
              if (seriesIndex !== 0) return ''; // Только для основной линии KD
              
              let realVal = data[dataPointIndex].kd; 
              let fullLab = data[dataPointIndex].fullLabel;
              if(realVal !== undefined && realVal !== null) {
                return `<div class="bg-[#141313]/95 border border-[#2a2626] rounded-sm p-3 shadow-xl flex flex-col items-start min-w-[120px]">
                          <div class="flex items-center text-[#8e9192] text-[11px] font-sans mb-1.5 uppercase tracking-wider">
                            <svg class="w-3.5 h-3.5 mr-1.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            ${fullLab}
                          </div>
                          <span class="text-[#dac493] font-garamond text-xl tracking-wide">${realVal.toFixed(2)} KD</span>
                        </div>`;
              }
              return '';
            },
            offsetY: -25 
          }
        };

        currentChart = new ApexCharts(document.querySelector("#apex-chart"), options);
        currentChart.render();
    }

    // =====================================
    // ГРАФИК 2: САМОЧУВСТВИЕ (МЕТА) - ПАУТИНА
    // =====================================
    function renderMetaChart(data) {
        // Категоризируем оценки от 1 до 10 в 5 групп
        const groups = {
            'Ужасно': [],
            'Плохо': [],
            'Нормально': [],
            'Хорошо': [],
            'Идеально': []
        };
        
        data.forEach(s => {
            let c = s.condition;
            if (c >= 1 && c <= 2) groups['Ужасно'].push(s.kd);
            else if (c >= 3 && c <= 4) groups['Плохо'].push(s.kd);
            else if (c >= 5 && c <= 6) groups['Нормально'].push(s.kd);
            else if (c >= 7 && c <= 8) groups['Хорошо'].push(s.kd);
            else if (c >= 9 && c <= 10) groups['Идеально'].push(s.kd);
        });

        const categories = Object.keys(groups);
        const avgData = categories.map(cat => {
            const arr = groups[cat];
            if (arr.length === 0) return null;
            return Number((arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(2));
        });
        
        const options = {
            series: [{ name: "Средний KD", data: avgData }],
            chart: {
                height: '100%',
                type: 'radar', 
                fontFamily: 'EB Garamond, serif',
                background: 'transparent',
                toolbar: { show: false },
                animations: { enabled: true, easing: 'easeinout', speed: 800 }
            },
            colors: ['#dac493'],
            stroke: { width: 2 },
            fill: { opacity: 0.2 },
            markers: { 
                size: 5, 
                colors: ['#141313'], 
                strokeColors: '#dac493', 
                strokeWidth: 2, 
                hover: { size: 8 } 
            },
            xaxis: { 
                categories: categories, 
                labels: { 
                    style: { colors: ['#8e9192','#8e9192','#8e9192','#8e9192','#8e9192'], fontFamily: 'Forum, serif', fontSize: '12px' } 
                } 
            },
            yaxis: { show: false, min: 0 },
            tooltip: {
                enabled: true,
                theme: 'dark',
                y: { formatter: function(val) { return val.toFixed(2) + " KD" } }
            },
            theme: { mode: 'dark' }
        };

        currentChart = new ApexCharts(document.querySelector("#apex-chart"), options);
        currentChart.render();
    }

  </script>
