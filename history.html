<style>
  * { box-sizing: border-box; }

  /* ТУЛТИП APEXCHARTS (ПЕЧАТЬ) */

    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    pointer-events: none !important; 
    opacity: 0; 
  }
  @keyframes stampFade {
    0% { opacity: 0; filter: blur(4px); transform: rotate(-3deg) scale(1.2); }
    100% { opacity: 1; filter: blur(0); transform: rotate(0) scale(1); }
  }
  .apexcharts-tooltip.tt-wrapper.apexcharts-active { animation: stampFade 0.25s ease-out forwards !important; }
  .apexcharts-tooltip-title { display: none !important; }

  .tt-design-stamp {
    background: transparent; padding: 10px; display: flex; justify-content: center;
  }
  .tt-design-stamp .tt-value {
    font-family: 'Special Elite', monospace;
    font-size: 28px;

    font-weight: bold;
    text-shadow: 2px 2px 0px #141313, -2px -2px 0px #141313, 2px -2px 0px #141313, -2px 2px 0px #141313, 0px 4px 10px rgba(0,0,0,0.8);

  .vignette::after {

    inset: 0;
    box-shadow: inset 0 0 160px rgba(0,0,0,0.95);
    pointer-events: none;
    z-index: 10;

  .victorian-card {
    border: 1px solid #57524a;
    background-color: rgba(24, 22, 21, 0.92);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
  }

  .nav-link {
    font-family: 'Forum', serif;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 10px;
    color: rgba(229, 226, 225, 0.5);

  .table-th {

    color: #dac493;
    text-transform: uppercase;

    border-bottom: 1px solid #57524a;

  .cell-date { font-family: 'Courier Prime', monospace; font-size: 12px; color: #8e9192; }
  .cell-num { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; }
  .cell-kd-positive { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; color: #85e0a3; }
  .cell-kd-negative { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; color: #ffb4ab; }
  
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

  .table-row { transition: background 0.2s; border-bottom: 1px solid rgba(87, 82, 74, 0.3); }

  /* Скрываем стрелочки у input type="number" */

  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;

  input[type=number] {

<body class="min-h-screen overflow-x-hidden w-full flex flex-col justify-between p-3 md:p-4 vignette antialiased selection:bg-error selection:text-on-error">

  <header class="flex justify-center items-center w-full shrink-0 relative z-40 mb-4 mt-2">
    <nav class="flex gap-2 sm:gap-6 md:gap-10 font-forum">
      <a class="nav-link" href="#" onclick="goToAnalytics(event)">АНАЛИТИКА</a>
      <a class="nav-link active" href="history.html">ИСТОРИЯ</a>
      <a class="nav-link" href="charts.html">ГРАФИКИ</a>
    </nav>
  </header>

  <main class="flex-grow w-full max-w-[1440px] mx-auto flex flex-col gap-4 relative z-20">
    <section class="victorian-card p-6 rounded-sm flex flex-col shadow-2xl">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h2 class="font-forum text-xl text-tertiary tracking-[3px] uppercase">Журнал Охоты</h2>
      </div>

      <div class="w-full overflow-x-auto custom-scrollbar pb-2">
        <table class="w-full text-left border-collapse min-w-[900px]">
          <thead>
            <tr>
              <th class="table-th pl-4 rounded-tl-sm">Начало сессии</th>
              <th class="table-th">Конец сессии</th>
              <th class="table-th text-center">Время сессии</th>
              <th class="table-th text-center">Убил</th>
              <th class="table-th text-center">Умер</th>
              <th class="table-th text-center">Матчей</th>
              <th class="table-th text-center">KD</th>
              <th class="table-th text-center">KPG</th>
              <th class="table-th text-center">Лодаут</th>
              <th class="table-th pl-4 w-64 max-w-xs">Комментарий</th>
              <th id="th-actions" class="table-th text-right hidden">Действия</th>
            </tr>
          </thead>
          <tbody id="history-body" class="divide-y divide-[#35312c]">
            <!-- Загрузка из базы -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- DRAWER OVERLAY -->
  <div id="drawer-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300" onclick="closeDrawer()"></div>
  
  <!-- DRAWER PANEL -->
  <div id="drawer-panel" class="fixed top-0 right-0 h-full w-full md:w-1/2 bg-[#141313] border-l border-[#57524a] shadow-[-10px_0_30px_rgba(0,0,0,0.9)] z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <!-- Header -->
    <div class="p-5 border-b border-[#35312c] flex justify-between items-center bg-[#181615]">
      <div>
        <h3 class="font-forum text-lg text-tertiary tracking-[2px] uppercase">История матчей</h3>
        <p id="drawer-date" class="font-courier text-xs text-[#8e9192]"></p>
        <p id="drawer-loadout" class="font-forum text-sm text-[#dac493]/80 mt-1"></p>
      </div>
      <button onclick="closeDrawer()" class="text-[#dac493]/50 hover:text-[#dac493] transition-colors p-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    
    <!-- Body -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-5 flex flex-col gap-6">
      
      <!-- Chart -->
      <div class="victorian-card p-4 rounded-sm flex flex-col min-h-[300px]">
        <h4 class="font-forum text-xs text-tertiary font-bold uppercase tracking-wider mb-2 text-center">Пульс KD <span onclick="if(window.matchMedia('(pointer: coarse)').matches) alert('Показывает, как менялся средний KD после каждого матча в течение этой сессии.')" title="Показывает, как менялся средний KD после каждого матча в течение этой сессии." class="cursor-help text-[11px] font-sans border border-[#dac493] text-[#dac493] rounded-full w-[15px] h-[15px] inline-flex items-center justify-center opacity-70 hover:opacity-100 transition-opacity ml-1 align-middle mb-[2px]">?</span></h4>
        <div class="w-full flex-grow relative min-h-[250px]">
          <div id="drawerChart" class="w-full h-full"></div>
        </div>
      </div>

      <!-- Table -->
      <div class="victorian-card p-4 rounded-sm">
        <h4 class="font-forum text-xs text-tertiary font-bold uppercase tracking-wider mb-3 text-center">Матчи</h4>
        <div id="drawer-matches-container">
          <div class="text-center text-[#dac493]/50 font-garamond text-sm">Загрузка...</div>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadHistory);

    let sessionsData = [];

    function formatDuration(s) {
      if (s.start_time && s.end_time) {
        const diff = new Date(s.end_time) - new Date(s.start_time);
        if (diff > 0) {
          const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
          const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
          const sec = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
          return `${h}:${m}:${sec}`;
        }
      }
      if (s.duration_hours) {
        const h = String(Math.floor(s.duration_hours)).padStart(2, '0');
        const m = String(Math.floor((s.duration_hours % 1) * 60)).padStart(2, '0');
        return `${h}:${m}:00`;
      }
      return '---';
    }

    let isDataLoading = false;
    let pendingLoad = false;

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadHistory();
      }
    });

    async function loadHistory() {
      if (isDataLoading) {
        pendingLoad = true;
        return;
      }
      isDataLoading = true;
      try {
        let data, error;
        let success = false;
        let retries = 3;
        for (let i = 0; i < retries; i++) {
          try {
            const res = await window.supabase
              .from('sessions')
              .select('*, matches(id)')
              .order('start_time', { ascending: false });
            data = res.data;
            error = res.error;
            if (error) throw error; // If supabase returns an error, throw it so it can be retried
            success = true;
            break;
          } catch (err) {
            if (i === retries - 1) throw err;
            console.warn(`Запрос упал, пробуем еще раз через секунду... (${i + 1}/${retries})`, err);
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        }
        if (!success) return;
        sessionsData = data;

      const isLoggedIn = localStorage.getItem('sb-tcdtgptiwjmoxugfjvmh-auth-token') !== null;
      document.getElementById('th-actions').classList.remove('hidden');

      const tbody = document.getElementById('history-body');
      tbody.innerHTML = data.map(s => {
        const kd = s.deaths > 0 ? (s.kills / s.deaths).toFixed(2) : s.kills.toFixed(2);
        const kpg = s.matches_count > 0 ? (s.kills / s.matches_count).toFixed(2) : '0.00';
        const kdClass = kd >= 2.0 ? 'cell-kd-positive' : 'cell-kd-negative';
        
        const hasMatches = s.matches && s.matches.length > 0;
        
        let actionHtml = `<td class="py-3 text-right pr-2 whitespace-nowrap" id="action-cell-${s.id}">`;
        if (hasMatches) {
          actionHtml += `<button onclick="openDrawer('${s.id}')" class="text-tertiary hover:text-white p-1" title="История матчей">📊</button>`;
        }
        if (isLoggedIn) {
          actionHtml += `<button onclick="editSession('${s.id}')" class="text-tertiary hover:text-white p-1 ml-1" title="Редактировать">✏️</button>`;
        }
        actionHtml += `</td>`;

        return `
          <tr class="table-row" id="row-${s.id}">
            <td class="py-3 cell-date">${new Date(s.start_time).toLocaleString()}</td>
            <td class="py-3 cell-date">${s.end_time ? new Date(s.end_time).toLocaleString() : '---'}</td>
            <td class="py-3 cell-date opacity-80 text-center">${formatDuration(s)}</td>
            <td class="py-3 cell-num" id="k-${s.id}">${s.kills}</td>
            <td class="py-3 cell-num" id="d-${s.id}">${s.deaths}</td>
            <td class="py-3 cell-num" id="m-${s.id}">${s.matches_count}</td>
            <td class="py-3 ${kdClass}">${kd}</td>
            <td class="py-3 cell-num">${kpg}</td>
            <td class="py-3 text-center" id="l-${s.id}">
              ${s.loadout ? `<span title="${s.loadout}" onclick="if(window.matchMedia('(pointer: coarse)').matches) alert('${s.loadout}')" class="cursor-help opacity-70 hover:opacity-100 text-[#dac493]">⚔️</span>` : `<span class="opacity-40">-</span>`}
            </td>
            <td class="py-3 font-garamond text-sm text-on-surface-variant pl-4 opacity-70 break-words whitespace-normal max-w-[250px]" id="c-${s.id}">${s.comment || ''}</td>
            ${actionHtml}
          </tr>
        `;
      }).join('');
      } catch (err) {
        console.error("Ошибка загрузки истории:", err);
      } finally {
        isDataLoading = false;
        if (pendingLoad) {
          pendingLoad = false;
          loadHistory();
        }
      }
    }

    function editSession(id) {
      const session = sessionsData.find(s => s.id === id);
      if (!session) return;

      document.getElementById(`k-${id}`).innerHTML = `<input type="number" id="input-k-${id}" value="${session.kills}" min="0" class="w-12 bg-black border border-[#57524a] text-center text-[#e5e2e1] rounded-sm outline-none">`;
      document.getElementById(`d-${id}`).innerHTML = `<input type="number" id="input-d-${id}" value="${session.deaths}" min="0" class="w-12 bg-black border border-[#57524a] text-center text-[#e5e2e1] rounded-sm outline-none">`;
      document.getElementById(`m-${id}`).innerHTML = `<input type="number" id="input-m-${id}" value="${session.matches_count}" min="0" class="w-12 bg-black border border-[#57524a] text-center text-[#e5e2e1] rounded-sm outline-none">`;
      document.getElementById(`l-${id}`).innerHTML = `<input type="text" id="input-l-${id}" value="${session.loadout || ''}" maxlength="75" class="w-16 bg-black border border-[#57524a] text-[#e5e2e1] px-1 rounded-sm outline-none text-xs" title="Лодаут">`;
      document.getElementById(`c-${id}`).innerHTML = `<input type="text" id="input-c-${id}" value="${session.comment || ''}" maxlength="75" class="w-full bg-black border border-[#57524a] text-[#e5e2e1] px-2 rounded-sm outline-none">`;
      
      document.getElementById(`action-cell-${id}`).innerHTML = `
        <button id="save-sess-${id}" onclick="saveSession('${id}', ${session.kills}, ${session.deaths}, ${session.matches_count})" class="text-green-500 hover:text-green-400 p-1 font-bold" title="Сохранить">✓</button>
        <button onclick="deleteSession('${id}', ${session.kills}, ${session.deaths}, ${session.matches_count})" class="text-red-500 hover:text-red-400 p-1 font-bold" title="Удалить">✕</button>
        <button onclick="loadHistory()" class="text-gray-400 hover:text-gray-200 p-1 ml-1" title="Отмена">↺</button>
      `;
    }

    async function saveSession(id, oldK, oldD, oldM) {
      const btn = document.getElementById(`save-sess-${id}`);
      if(btn) btn.innerHTML = "⌛";

      const newK = parseInt(document.getElementById(`input-k-${id}`).value) || 0;
      const newD = parseInt(document.getElementById(`input-d-${id}`).value) || 0;
      const newM = parseInt(document.getElementById(`input-m-${id}`).value) || 0;
      const newC = document.getElementById(`input-c-${id}`).value || null;
      const newL = document.getElementById(`input-l-${id}`).value || null;

      const deltaK = newK - oldK;
      const deltaD = newD - oldD;
      const deltaM = newM - oldM;

      const { error: sessErr } = await window.supabase
        .from('sessions')
        .update({ kills: newK, deaths: newD, matches_count: newM, comment: newC, loadout: newL })
        .eq('id', id);

      if (sessErr) {
        alert("Ошибка сохранения");
        loadHistory();
        return;
      }

      if (deltaK !== 0 || deltaD !== 0 || deltaM !== 0) {
        const { data: profs } = await window.supabase.from('hunter_profile').select('*').limit(1);
        if (profs && profs.length > 0) {
          const p = profs[0];
          await window.supabase.from('hunter_profile').update({
            total_kills: Math.max(0, p.total_kills + deltaK),
            total_deaths: Math.max(0, p.total_deaths + deltaD),
            total_matches: Math.max(0, p.total_matches + deltaM)
          }).eq('id', p.id);
        }
      }

      if(btn) {
        btn.innerHTML = '✓';
        btn.classList.add('text-green-300');
        setTimeout(loadHistory, 500);
      } else {
        loadHistory();
      }
    }

    async function deleteSession(id, k, d, m) {
      if (!confirm("ВНИМАНИЕ! Вы удаляете целую сессию. Все её матчи будут удалены (каскадно базой данных), а убийства и смерти вычтены из профиля. Продолжить?")) return;

      const { error: delErr } = await window.supabase.from('sessions').delete().eq('id', id);
      if (delErr) {
        alert("Ошибка удаления");
        return;
      }

      const { data: profs } = await window.supabase.from('hunter_profile').select('*').limit(1);
      if (profs && profs.length > 0) {
        const p = profs[0];
        await window.supabase.from('hunter_profile').update({
          total_kills: Math.max(0, p.total_kills - k),
          total_deaths: Math.max(0, p.total_deaths - d),
          total_matches: Math.max(0, p.total_matches - m)
        }).eq('id', p.id);
      }

      loadHistory();
    }

    async function goToAnalytics(event) {
      if (event) event.preventDefault();
      const { data: { session } } = await window.supabase.auth.getSession();
      window.location.href = session ? 'admin.html' : 'index.html';
    }

    // DRAWER LOGIC
    let drawerChartInstance = null;

    async function openDrawer(sessionId) {
      const session = sessionsData.find(s => s.id === sessionId);
      if (!session) return;
      
      document.getElementById('drawer-date').textContent = new Date(session.start_time).toLocaleString();
      document.getElementById('drawer-loadout').textContent = session.loadout ? `⚔️ ${session.loadout}` : '';
      
      document.getElementById('drawer-matches-container').innerHTML = '<div class="text-center text-[#dac493]/50 font-garamond text-sm">Загрузка...</div>';
      
      const overlay = document.getElementById('drawer-overlay');
      const panel = document.getElementById('drawer-panel');
      
      overlay.classList.remove('hidden');
      void overlay.offsetWidth; // trigger reflow
      overlay.classList.remove('opacity-0');
      panel.classList.remove('translate-x-full');

      // Fetch matches
      const { data: matches, error } = await window.supabase
        .from('matches')
        .select('*')
        .eq('session_id', sessionId)
        .order('created_at', { ascending: true });

      if (error) {
        document.getElementById('drawer-matches-container').innerHTML = '<div class="text-center text-red-500 font-garamond text-sm">Ошибка загрузки</div>';
        return;
      }

      renderDrawerMatches(matches);
      renderDrawerChart(matches);
    }

    function closeDrawer() {
      const overlay = document.getElementById('drawer-overlay');
      const panel = document.getElementById('drawer-panel');
      
      overlay.classList.add('opacity-0');
      panel.classList.add('translate-x-full');
      
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function renderDrawerMatches(matches) {
      const container = document.getElementById('drawer-matches-container');
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="text-center text-[#dac493]/50 font-garamond py-4">Детальная поматчевая статистика недоступна для старых сессий.</div>';
        return;
      }

      let html = `<table class="w-full text-left font-garamond text-base text-[#e5e2e1] border-collapse">
        <thead>
          <tr class="border-b border-[#dac493]/20">
            <th class="py-2 font-forum text-[#dac493]/70 font-normal uppercase tracking-wider">Матч</th>
            <th class="py-2 font-forum text-[#dac493]/70 font-normal uppercase tracking-wider text-center">Киллы</th>
            <th class="py-2 font-forum text-[#dac493]/70 font-normal uppercase tracking-wider text-center">Смерти</th>
          </tr>
        </thead>
        <tbody>`;
        
      let totalK = 0;
      let totalD = 0;
      matches.forEach((m, idx) => {
        totalK += m.kills;
        totalD += m.deaths;
        html += `<tr class="border-b border-[#35312c]">
          <td class="py-3 text-[#dac493]">#${idx + 1}</td>
          <td class="py-3 text-center cell-num text-lg">${m.kills}</td>
          <td class="py-3 text-center cell-num text-lg">${m.deaths}</td>
        </tr>`;
      });
      html += `<tr class="border-b-2 border-t-2 border-[#dac493]/30 bg-[rgba(218,196,147,0.05)]">
        <td class="py-3 font-forum text-[#dac493] font-bold tracking-wider uppercase text-sm">Итого</td>
        <td class="py-3 text-center cell-num text-[#dac493] font-bold text-lg">${totalK}</td>
        <td class="py-3 text-center cell-num text-[#dac493] font-bold text-lg">${totalD}</td>
      </tr>`;
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function renderDrawerChart(matches) {
      if (drawerChartInstance) {
        drawerChartInstance.destroy();
      }

      if (!matches || matches.length === 0) {
        return; 
      }

      let rollingKills = 0;
      let rollingDeaths = 0;
      const kdData = [];
      const labels = [];
      
      kdData.push(0);
      labels.push('Старт');

      matches.forEach((m, idx) => {
        rollingKills += m.kills;
        rollingDeaths += m.deaths;
        const currentKD = rollingDeaths > 0 ? (rollingKills / rollingDeaths) : rollingKills;
        kdData.push(currentKD);
        labels.push(`Матч ${idx + 1}`);
      });

      const targetKD = 2.0;
      let maxKD = targetKD;
      let minKD = 0.5;
      kdData.forEach(v => {
          if (v > maxKD) maxKD = v;
          if (v < minKD) minKD = v;
      });
      maxKD += 0.2;
      minKD -= 0.2;
      if (minKD < 0) minKD = 0;

      const getColorForKD = (kd) => {
          if (kd >= targetKD) {
              let ratio = maxKD > targetKD ? (kd - targetKD) / (maxKD - targetKD) : 1;
              ratio = Math.min(1, Math.max(0, ratio));
              return `hsl(120, ${Math.round(ratio * 100)}%, ${Math.round(62 - 12*ratio)}%)`;
          } else {
              let ratio = targetKD > minKD ? (targetKD - kd) / (targetKD - minKD) : 1;
              ratio = Math.min(1, Math.max(0, ratio));
              return `hsl(0, ${Math.round(ratio * 100)}%, ${Math.round(62 - 12*ratio)}%)`;
          }
      };

      const colorStops = [];
      const numStops = 20;
      for (let i = 0; i <= numStops; i++) {
          let offset = (i / numStops) * 100;
          let kdAtOffset = maxKD - (i / numStops) * (maxKD - minKD);
          colorStops.push({
              offset: offset,
              color: getColorForKD(kdAtOffset),
              opacity: 1
          });
      }

      const options = {
          series: [{ name: "KD", data: kdData }],
          chart: {
            height: '100%',
            type: 'line', 
            fontFamily: 'EB Garamond, serif',
            background: 'transparent',
            toolbar: { show: false },
            zoom: { enabled: false },
            animations: { enabled: true, easing: 'easeinout', speed: 800 }
          },
          fill: {
            type: 'gradient',
            gradient: { type: 'vertical', shadeIntensity: 1, colorStops: colorStops }
          },
          stroke: { curve: 'smooth', width: 3 }, 
          markers: {
            size: 4,
            colors: ['#141313'], 
            strokeColors: '#57524a',
            strokeWidth: 2,
            hover: { size: 6 }
          },
          dataLabels: { enabled: false },
          xaxis: {
            categories: labels,
            axisBorder: { show: false },
            axisTicks: { show: false },
            labels: { style: { colors: '#8e9192', fontFamily: 'Forum, serif', fontSize: '11px' } },
            tooltip: { enabled: false },
            crosshairs: { show: false }
          },
          yaxis: {
            max: maxKD,
            min: minKD,
            tooltip: { enabled: false },
            labels: {
              style: { colors: '#8e9192', fontFamily: 'Courier Prime, monospace' },
              formatter: (value) => { return value.toFixed(2) }
            }
          },
          grid: { borderColor: 'rgba(255, 255, 255, 0.05)', strokeDashArray: 4 },
          theme: { mode: 'dark' },
          annotations: {
            yaxis: [{ y: targetKD, borderColor: 'rgba(218, 196, 147, 0.4)', strokeDashArray: 5 }]
          },
          tooltip: {
            enabled: true,
            cssClass: 'tt-wrapper',
            shared: true, 
            intersect: false, 
            custom: function({series, seriesIndex, dataPointIndex, w}) {
              let val = series[seriesIndex][dataPointIndex];
              if(val !== undefined && val !== null) {
                return `<div class="tt-design-stamp"><span class="tt-value">${val.toFixed(2)} KD</span></div>`;
              }
              return '';
            },
            offsetY: -25 
          }
      };

      drawerChartInstance = new ApexCharts(document.querySelector("#drawerChart"), options);
      drawerChartInstance.render();
    }
  </script>
