<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Hunt Tracker — История Сессий</title>

<!-- Google Fonts — строго по спецификации TYPOGRAPHY.md -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Forum&family=Special+Elite&display=swap" rel="stylesheet">

<!-- Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#141313",
          "tertiary": "#dac493",
          "on-background": "#e5e2e1",
          "on-surface-variant": "#c4c7c7",
          "error": "#ffb4ab"
        },
        fontFamily: {
          "garamond": ["EB Garamond", "serif"],
          "forum": ["Forum", "serif"],
          "courier": ["Courier Prime", "monospace"],
          "stamp": ["Special Elite", "monospace"]
        }
      }
    }
  }
</script>

<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100vh;
    overflow: hidden;
    background-image: url('1.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #141313;
    color: #e5e2e1;
    font-family: 'EB Garamond', serif;
  }
  .vignette { box-shadow: inset 0 0 160px rgba(0,0,0,0.95); }
  
  .victorian-card {
    border: 1px solid #57524a;
    background-color: rgba(24, 22, 21, 0.92);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
  }

  .nav-link {
    font-family: 'Forum', serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 10px 20px;
    color: rgba(229, 226, 225, 0.5);
    transition: all 0.3s ease;
    text-transform: uppercase;
  }
  .nav-link:hover { color: #ffffff; }
  .nav-link.active {
    color: #ffffff;
    font-weight: 700;
    border-bottom: 2px solid #b5a172;
  }

  .table-th {
    font-family: 'Forum', serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: #dac493;
    text-transform: uppercase;
    padding: 10px 8px;
    border-bottom: 1px solid #57524a;
    background-color: rgba(18, 16, 15, 0.98);
    font-weight: bold;
    position: sticky;
    top: 0;
  }

  .cell-date { font-family: 'Courier Prime', monospace; font-size: 12px; color: #8e9192; }
  .cell-num { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; }
  .cell-kd-positive { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; color: #85e0a3; }
  .cell-kd-negative { font-family: 'Special Elite', monospace; font-size: 14px; text-align: center; color: #ffb4ab; }
  
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #57524a; border-radius: 2px; }

  .table-row { transition: background 0.2s; border-bottom: 1px solid rgba(87, 82, 74, 0.3); }
  .table-row:hover { background: rgba(218, 196, 147, 0.05); }
</style>
</head>

<body class="h-screen w-full flex flex-col justify-between p-4 md:p-5 vignette antialiased selection:bg-error selection:text-on-error">

  <header class="flex justify-center items-center w-full shrink-0 relative z-40 mb-6 mt-2">
    <nav class="flex gap-10 font-forum">
      <a class="nav-link" href="#" onclick="goToAnalytics(event)">АНАЛИТИКА</a>
      <a class="nav-link active" href="history.html">ИСТОРИЯ</a>
      <a class="nav-link" href="charts.html">ГРАФИКИ</a>
    </nav>
  </header>

  <main class="flex-grow w-full max-w-[1440px] mx-auto flex flex-col gap-4 relative z-20 min-h-0">
    <section class="victorian-card p-6 rounded-sm flex flex-col h-full min-h-0 shadow-2xl">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h2 class="font-forum text-xl text-tertiary tracking-[3px] uppercase">Журнал Охоты</h2>
        <div class="font-garamond text-xs text-on-surface-variant italic">Records from the Louisiana bayou</div>
      </div>

      <div class="overflow-auto flex-grow min-h-0 custom-scrollbar pr-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr>
              <th class="table-th">Начало</th>
              <th class="table-th">Конец</th>
              <th class="table-th text-center">Убийств</th>
              <th class="table-th text-center">Смертей</th>
              <th class="table-th text-center">Матчей</th>
              <th class="table-th text-center">KD</th>
              <th class="table-th text-center">KPG</th>
              <th class="table-th pl-4">Комментарий</th>
            </tr>
          </thead>
          <tbody id="history-body" class="divide-y divide-[#35312c]">
            <!-- Загрузка из базы -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", loadHistory);

    async function loadHistory() {
      const { data, error } = await window.supabase
        .from('sessions')
        .select('*')
        .order('start_time', { ascending: false });

      if (error) return console.error(error);

      const tbody = document.getElementById('history-body');
      tbody.innerHTML = data.map(s => {
        const kd = s.deaths > 0 ? (s.kills / s.deaths).toFixed(2) : s.kills.toFixed(2);
        const kpg = s.matches_count > 0 ? (s.kills / s.matches_count).toFixed(2) : '0.00';
        const kdClass = kd >= 2.0 ? 'cell-kd-positive' : 'cell-kd-negative';
        
        return `
          <tr class="table-row">
            <td class="py-3 cell-date">${new Date(s.start_time).toLocaleString()}</td>
            <td class="py-3 cell-date">${s.end_time ? new Date(s.end_time).toLocaleString() : '---'}</td>
            <td class="py-3 cell-num">${s.kills}</td>
            <td class="py-3 cell-num">${s.deaths}</td>
            <td class="py-3 cell-num">${s.matches_count}</td>
            <td class="py-3 ${kdClass}">${kd}</td>
            <td class="py-3 cell-num">${kpg}</td>
            <td class="py-3 font-garamond text-sm text-on-surface-variant pl-4 opacity-70">${s.comment || ''}</td>
          </tr>
        `;
      }).join('');
    }

    function goToAnalytics(event) {
      if (event) event.preventDefault();
      const isLoggedIn = localStorage.getItem('sb-tcdtgptiwjmoxugfjvmh-auth-token') !== null;
      window.location.href = isLoggedIn ? 'admin.html' : 'index.html';
    }
  </script>
</body>
</html>
