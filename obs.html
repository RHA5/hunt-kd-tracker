<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OBS Widget</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Forum&family=Special+Elite&display=swap" rel="stylesheet">

<!-- Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "transparent",
          "tertiary": "#dac493",
          "error": "#ffb4ab"
        },
        fontFamily: {
          "garamond": ["EB Garamond", "serif"],
          "forum": ["Forum", "serif"],
          "stamp": ["Special Elite", "monospace"]
        }
      }
    }
  }
</script>

<style>
  html, body {
    background-color: transparent !important;
    overflow: hidden;
  }
  .victorian-card {
    border: 1px solid #57524a;
    background-color: rgba(24, 22, 21, 0.85);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    border-radius: 6px;
  }
  .gradient-line {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, #57524a 50%, transparent 100%);
  }
  .pulse-anim {
    transition: all 0.3s ease;
  }
</style>
</head>

<body class="w-full h-screen p-4 flex items-start justify-start text-[#e5e2e1] antialiased">

  <div class="victorian-card w-[320px] p-5 flex flex-col">
    <!-- Шапка -->
    <h2 class="font-forum text-xl text-tertiary font-bold tracking-[2px] uppercase text-center mb-1 drop-shadow-md">
      Статистика дня
    </h2>
    <div class="gradient-line mb-3"></div>

    <!-- Основной фокус: прирост КД -->
    <div class="flex flex-col items-center justify-center mb-4">
      <span class="font-garamond text-xs text-gray-400 uppercase tracking-widest mb-1">Прирост КД</span>
      <span id="live-delta" class="font-stamp text-2xl font-bold text-gray-400 pulse-anim drop-shadow-md">
        +0.00000
      </span>
    </div>

    <!-- Показатели сессии -->
    <div class="flex justify-between items-center bg-[#11100f] bg-opacity-50 p-3 rounded border border-[#35312c]">
      <div class="flex flex-col items-center w-1/3 border-r border-[#35312c]">
        <span class="font-garamond text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">KD дня</span>
        <span id="session-kd" class="font-stamp text-lg font-bold text-white pulse-anim">0.00</span>
      </div>
      <div class="flex flex-col items-center w-1/3 border-r border-[#35312c]">
        <span class="font-garamond text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">Убил</span>
        <span id="session-kills" class="font-stamp text-lg font-bold text-white pulse-anim">0</span>
      </div>
      <div class="flex flex-col items-center w-1/3">
        <span class="font-garamond text-[10px] text-gray-500 uppercase tracking-wider mb-0.5">Умер</span>
        <span id="session-deaths" class="font-stamp text-lg font-bold text-white pulse-anim">0</span>
      </div>
    </div>
  </div>

  <script>
    let globalStats = null;
    let currentSession = null;
    let previousKills = -1;
    let previousDeaths = -1;

    document.addEventListener("DOMContentLoaded", function() {
      loadData();
      
      let loadDataTimeout = null;
      function debouncedLoadData() {
          if (loadDataTimeout) clearTimeout(loadDataTimeout);
          loadDataTimeout = setTimeout(() => {
              loadData();
          }, 300);
      }

      window.supabase.channel('public:all-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'hunter_profile' }, payload => { debouncedLoadData(); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions' }, payload => { debouncedLoadData(); })
        .subscribe();
    });

    async function loadData() {
      try {
        const { data: gData } = await window.supabase.from('hunter_profile').select('*').single();
        globalStats = gData;

        const { data: sData } = await window.supabase.from('sessions')
          .select('*').eq('is_active', true).order('start_time', { ascending: false }).limit(1).single();
        currentSession = sData || null;

        calculateAndRender();
      } catch (e) {
        console.error("Ошибка загрузки данных для виджета OBS:", e);
      }
    }

    function triggerPulse(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.style.transform = 'scale(1.15)';
      el.style.filter = 'brightness(1.5)';
      setTimeout(() => {
        el.style.transform = 'scale(1)';
        el.style.filter = 'brightness(1)';
      }, 300);
    }

    function calculateAndRender() {
      if (!globalStats) return;

      let kills = 0;
      let deaths = 0;
      let skd = 0.00;
      let delta = 0;

      if (currentSession) {
        kills = currentSession.kills || 0;
        deaths = currentSession.deaths || 0;
        skd = deaths > 0 ? kills / deaths : kills;
        
        const oldKD = (globalStats.total_kills - kills) / Math.max(1, globalStats.total_deaths - deaths);
        const currentTotalKD = globalStats.total_kills / Math.max(1, globalStats.total_deaths);
        delta = currentTotalKD - oldKD;
      }

      // Анимация при изменении киллов/смертей
      if (previousKills !== -1 && previousKills !== kills) {
        triggerPulse('session-kills');
        triggerPulse('live-delta');
        triggerPulse('session-kd');
      }
      if (previousDeaths !== -1 && previousDeaths !== deaths) {
        triggerPulse('session-deaths');
        triggerPulse('live-delta');
        triggerPulse('session-kd');
      }
      
      previousKills = kills;
      previousDeaths = deaths;

      document.getElementById('session-kills').innerText = kills;
      document.getElementById('session-deaths').innerText = deaths;
      
      const skdEl = document.getElementById('session-kd');
      skdEl.innerText = skd.toFixed(2);

      // Отрисовка дельты (прироста)
      const deltaElem = document.getElementById('live-delta');
      const sign = delta > 0 ? '+' : (delta < 0 ? '' : '+');
      deltaElem.innerText = `${sign}${delta.toFixed(5)}`;
      
      deltaElem.classList.remove('text-gray-400', 'text-[#81c784]', 'text-[#ffb4ab]');
      if (delta > 0) {
        deltaElem.classList.add('text-[#81c784]');
      } else if (delta < 0) {
        deltaElem.classList.add('text-[#ffb4ab]');
      } else {
        deltaElem.classList.add('text-gray-400');
      }
    }
  </script>
</body>
</html>
